<!DOCTYPE html>
<html>
<head>
    <title>Create Placeholder Images</title>
</head>
<body>
    <h1>Creating Placeholder Images...</h1>
    <div id="output"></div>

    <script>
        function createPlaceholderImage(text, filename, width = 300, height = 300) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, width, height);
            
            // Border
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, width-2, height-2);
            
            // Text
            ctx.fillStyle = '#666';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, width/2, height/2);
            
            // Download
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
            
            document.getElementById('output').innerHTML += `<p>✅ Created ${filename}</p>`;
        }
        
        // Create placeholder images
        createPlaceholderImage('Headshot', 'placeholder-headshot.jpg');
        createPlaceholderImage('Press Image', 'placeholder-press.jpg');
        
        document.getElementById('output').innerHTML += '<h2>✅ All placeholder images created!</h2>';
    </script>
</body>
</html>
